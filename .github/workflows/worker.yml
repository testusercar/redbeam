# Deploy the update Worker (workers/updater) when it changes on main.
#
# The Worker serves the update channel and takes bug reports (POST /reports).
# Deploying it is `wrangler deploy` with the same CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets the release workflow uploads with. It also
# sets the Worker's SYNC_KEY, the key reports.yml uses to read the report
# inbox. Both workflows derive it from CLOUDFLARE_API_TOKEN, so there is no
# separate secret to add, and rotating the API token rotates it.
#
# Deploying does not touch the channel: manifest.json and the installers are
# R2 objects, and only release.yml writes those.

name: Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/updater/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redbeam-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Test the Worker
        run: npx vitest run workers/updater

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be Actions secrets. See docs/UPDATES.md." >&2
            exit 1
          fi

      - name: Deploy
        working-directory: workers/updater
        run: npx --yes wrangler@4 deploy

      # Same derivation as reports.yml. Keep the two in step.
      - name: Give the Worker its report inbox key
        working-directory: workers/updater
        run: |
          key=$(printf 'redbeam-report-sync:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$key"
          printf '%s' "$key" | npx --yes wrangler@4 secret put SYNC_KEY

      # A new version takes a few seconds to reach every edge; ask again before failing.
      - name: Check the channel still answers
        run: |
          host=https://redbeam-updates.trackchairking.workers.dev
          key=$(printf 'redbeam-report-sync:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$key"
          for attempt in 1 2 3 4 5 6; do
            health=$(curl -fsS "$host/health" || true)
            preflight=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$host/reports")
            inbox=$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $key" "$host/reports/inbox")
            echo "try $attempt: health $health, OPTIONS /reports $preflight, GET /reports/inbox $inbox"
            case "$health" in *'"ok":true'*) ok=1 ;; *) ok=0 ;; esac
            [ "$ok" = 1 ] && [ "$preflight" = 204 ] && [ "$inbox" = 200 ] && exit 0
            sleep 10
          done
          echo "The deployed Worker is not serving updates, reports and the report inbox." >&2
          exit 1
