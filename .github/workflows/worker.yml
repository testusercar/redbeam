# Deploy the update Worker (workers/updater) when it changes on main.
#
# The Worker serves the update channel and takes bug reports (POST /reports).
# Deploying it is `wrangler deploy` with the same CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets the release workflow uploads with. If the
# NOTION_TOKEN secret is set, it is copied into the Worker so each report is
# also filed in the REDBEAM reports database; without it reports are kept in
# R2 under reports/ and nothing else changes.
#
# Deploying does not touch the channel: manifest.json and the installers are
# R2 objects, and only release.yml writes those.

name: Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/updater/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redbeam-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Test the Worker
        run: npx vitest run workers/updater

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be Actions secrets. See docs/UPDATES.md." >&2
            exit 1
          fi

      - name: Deploy
        working-directory: workers/updater
        run: npx --yes wrangler@4 deploy

      - name: Give the Worker the Notion token
        if: env.NOTION_TOKEN != ''
        working-directory: workers/updater
        run: printf '%s' "$NOTION_TOKEN" | npx --yes wrangler@4 secret put NOTION_TOKEN

      - name: Check the channel still answers
        run: |
          health=$(curl -fsS https://redbeam-updates.trackchairking.workers.dev/health)
          echo "$health"
          case "$health" in *'"ok":true'*) ;; *) echo "Worker /health is not ok after deploy." >&2; exit 1 ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS https://redbeam-updates.trackchairking.workers.dev/reports)
          echo "OPTIONS /reports -> $code"
          [ "$code" = "204" ] || { echo "The deployed Worker does not take reports." >&2; exit 1; }
