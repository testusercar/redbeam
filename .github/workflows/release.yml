# Build signed Windows installers and publish them to the update channel.
#
# Ship path: bump the version, commit, tag vMAJOR.MINOR.PATCH, push the tag.
# This workflow builds x64 and arm64 NSIS on windows-latest, signs them with
# TAURI_SIGNING_PRIVATE_KEY, and runs workers/updater/publish.ps1, which puts
# the installers and .sig files and then manifest.json, all with wrangler
# --remote. No step runs on a particular PC.
#
# workflow_dispatch is the same pipeline with a dry_run switch (default on)
# so a click in the Actions tab does not upload another installer.
# Tags must be vMAJOR.MINOR.PATCH. v1.2.3-beta fails the version check.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.3.2. Must match tauri.conf.json."
        required: true
        type: string
      notes:
        description: "Release notes the installed app shows with the update."
        required: true
        type: string
      dry_run:
        description: "Build and sign, write the manifest, and do not upload to R2 or GitHub Releases."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: redbeam-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: NSIS ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check the version matches the tree
        shell: pwsh
        run: |
          node workers/updater/assert-version.mjs $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "version check failed" }

      - name: Require the updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is empty. Copy the updater private key into that GitHub Actions secret once. See docs/UPDATES.md."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          prefix-key: ${{ matrix.arch }}

      - name: Install npm dependencies
        run: npm ci

      # NSIS only. WiX cannot bundle aarch64, and the in-app updater installs
      # the NSIS exe. scripts/build-arm64.cmd is the native ARM64 machine
      # script (vcvarsarm64); this job cross-compiles on an x64 runner, which
      # already has the MSVC ARM64 tools.
      - name: Build signed NSIS
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Require the installer and its signature
        shell: pwsh
        run: |
          $dir = "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $exe = @(Get-ChildItem -LiteralPath $dir -Filter "*-setup.exe" -File)
          $sig = @(Get-ChildItem -LiteralPath $dir -Filter "*-setup.exe.sig" -File)
          if ($exe.Count -ne 1) { throw "Expected one NSIS installer in $dir, found $($exe.Count)." }
          if ($sig.Count -ne 1) { throw "Expected a .sig beside $($exe[0].Name). The signing key did not produce one." }

      - uses: actions/upload-artifact@v4
        with:
          name: nsis-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig

  publish:
    name: Publish channel
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
      # Boolean inputs are sometimes real booleans and sometimes the strings
      # "true" / "false". Compare both so an unchecked dry run actually uploads.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && 'true' || 'false' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare credentials when uploading
        if: env.DRY_RUN != 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            throw "CLOUDFLARE_API_TOKEN is empty. See docs/UPDATES.md."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw "CLOUDFLARE_ACCOUNT_ID is empty. See docs/UPDATES.md."
          }

      - uses: actions/download-artifact@v4
        with:
          path: nsis-artifacts

      - name: Lay the installers where publish.ps1 looks
        shell: pwsh
        run: |
          $map = @{
            'nsis-x64' = 'x86_64-pc-windows-msvc'
            'nsis-arm64' = 'aarch64-pc-windows-msvc'
          }
          foreach ($name in $map.Keys) {
            $src = Join-Path 'nsis-artifacts' $name
            if (-not (Test-Path -LiteralPath $src)) { throw "Missing artifact $name. Both architectures are required." }
            $dest = Join-Path "apps/desktop/src-tauri/target/$($map[$name])/release/bundle/nsis"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path (Join-Path $src '*') -Destination $dest
            $exe = @(Get-ChildItem -LiteralPath $dest -Filter '*-setup.exe' -File)
            $sig = @(Get-ChildItem -LiteralPath $dest -Filter '*-setup.exe.sig' -File)
            if ($exe.Count -ne 1 -or $sig.Count -ne 1) {
              throw "Expected one installer and one .sig in $dest."
            }
          }

      - name: Publish to R2
        id: channel
        shell: pwsh
        run: |
          $version = node workers/updater/assert-version.mjs $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "version check failed" }
          $version = "$version".Trim()
          $tag = "v$version"
          # A missing tag is the workflow_dispatch case: the release step creates it.
          # git exiting 1 must not fail the step.
          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $existing = git rev-parse --verify "refs/tags/${tag}^{commit}" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $saved
          if ($tagExists) {
            $head = (git rev-parse HEAD).Trim()
            if ($existing.Trim() -ne $head) {
              throw "Tag $tag points at $($existing.Trim()), not $head. Refusing to publish this commit over that tag."
            }
          }
          $notes = $env:RELEASE_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "REDBEAM $version" }
          }
          Set-Content -Path release-notes.txt -Value $notes -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8NoBOM
          $publishArgs = @('-Version', $version, '-Notes', $notes, '-Yes')
          if ($env:DRY_RUN -eq 'true') { $publishArgs += '-DryRun' }
          & .\workers\updater\publish.ps1 @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "publish.ps1 failed" }
          if ($env:DRY_RUN -eq 'true') { return }
          $health = curl.exe -fsS https://redbeam-updates.trackchairking.workers.dev/health
          Write-Host $health
          if ($health -notmatch '"channel":"published"') {
            throw "Worker health did not report a published channel: $health"
          }

      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.channel.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.txt
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
