<style id="rb-style">
  :root {
    --paper:#F6F7F8; --surface:#FFFFFF; --surface-2:#EFF1F3;
    --ink:#16181A; --ink-2:#3D4448; --grey:#6B7176; --rule:#DCE0E3;
    --red:#C2382C; --red-soft:#F5E2DF;
    --slate:#3E6B84; --slate-soft:#E1EAEF;
    --amber:#8A6212; --amber-soft:#F6EBD4;
    --green:#2F6B4F; --green-soft:#DFEDE5;
    --f-display:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
    --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#131517; --surface:#1A1D20; --surface-2:#212528;
      --ink:#E9ECEE; --ink-2:#B4BBC0; --grey:#8B9298; --rule:#2B3034;
      --red:#E4685A; --red-soft:#35211F;
      --slate:#7FB2CC; --slate-soft:#1B2A33;
      --amber:#D9A63C; --amber-soft:#2E2617;
      --green:#71B591; --green-soft:#16281F;
    }
  }
  :root[data-theme="dark"] {
    --paper:#131517; --surface:#1A1D20; --surface-2:#212528;
    --ink:#E9ECEE; --ink-2:#B4BBC0; --grey:#8B9298; --rule:#2B3034;
    --red:#E4685A; --red-soft:#35211F;
    --slate:#7FB2CC; --slate-soft:#1B2A33;
    --amber:#D9A63C; --amber-soft:#2E2617;
    --green:#71B591; --green-soft:#16281F;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--f-body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:70rem; margin:0 auto; padding:0 1.75rem 5rem; }

  /* ---- header ---- */
  .top { padding:2.25rem 0 1.1rem; border-bottom:2px solid var(--ink); }
  .toprow { display:flex; flex-wrap:wrap; gap:1rem 2rem; align-items:baseline; justify-content:space-between; }
  h1 {
    font-family:var(--f-display); font-weight:700; letter-spacing:-.015em;
    font-size:clamp(1.7rem,3.4vw,2.4rem); margin:0; line-height:1;
  }
  .sub { font-family:var(--f-mono); font-size:.72rem; letter-spacing:.13em; text-transform:uppercase; color:var(--red); margin-bottom:.5rem; }
  .headline-count { font-family:var(--f-mono); font-size:1.6rem; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .headline-count em { font-style:normal; color:var(--grey); font-size:.95rem; font-weight:400; }

  .meter { height:8px; background:var(--surface-2); margin-top:1rem; display:flex; overflow:hidden; }
  .meter i { display:block; height:100%; }
  .meter .m-done { background:var(--green); }
  .meter .m-doing { background:var(--amber); }
  .legend { display:flex; flex-wrap:wrap; gap:1.15rem; margin-top:.55rem; font-family:var(--f-mono); font-size:.7rem; color:var(--grey); }
  .legend b { color:var(--ink); font-weight:500; }
  .dotk { display:inline-block; width:8px; height:8px; margin-right:.35rem; vertical-align:baseline; }

  /* ---- now banner ---- */
  .now {
    margin-top:1.75rem; border:1px solid var(--rule); border-left:4px solid var(--amber);
    background:var(--surface); padding:1rem 1.2rem;
    display:flex; flex-wrap:wrap; gap:.75rem 1.5rem; align-items:center; justify-content:space-between;
  }
  .now.idle { border-left-color:var(--grey); }
  .now-k { font-family:var(--f-mono); font-size:.64rem; letter-spacing:.13em; text-transform:uppercase; color:var(--amber); }
  .now.idle .now-k { color:var(--grey); }
  .now-t { font-family:var(--f-display); font-weight:600; font-size:1.15rem; line-height:1.2; }
  .now-m { font-size:.88rem; color:var(--ink-2); max-width:60ch; margin-top:.15rem; }
  .now-id { font-family:var(--f-mono); font-size:.8rem; color:var(--grey); }

  /* ---- tiers ---- */
  .tierhead {
    display:flex; align-items:baseline; gap:.9rem; margin:2.5rem 0 .2rem;
    border-bottom:1px solid var(--ink); padding-bottom:.4rem;
  }
  .tierhead h2 { font-family:var(--f-display); font-weight:700; font-size:1.3rem; margin:0; }
  .tierhead .tcount { font-family:var(--f-mono); font-size:.8rem; color:var(--grey); font-variant-numeric:tabular-nums; margin-left:auto; }

  /* ---- phase ---- */
  .phase { border-bottom:1px solid var(--rule); }
  .ph {
    display:flex; align-items:center; gap:.8rem; padding:.85rem 0 .7rem;
    cursor:pointer; user-select:none;
  }
  .ph:hover .ph-t { color:var(--red); }
  .ph-n { font-family:var(--f-mono); font-size:.8rem; color:var(--grey); font-variant-numeric:tabular-nums; min-width:1.6rem; }
  .ph-t { font-family:var(--f-display); font-weight:600; font-size:1.05rem; }
  .ph-bar { flex:1; height:4px; background:var(--surface-2); min-width:3rem; display:flex; overflow:hidden; }
  .ph-bar i { height:100%; }
  .ph-c { font-family:var(--f-mono); font-size:.76rem; color:var(--grey); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ph-x { font-family:var(--f-mono); font-size:.85rem; color:var(--grey); width:1rem; text-align:center; }

  .items { display:none; padding:0 0 .9rem; }
  .phase.open .items { display:block; }

  .item {
    display:flex; align-items:flex-start; gap:.7rem;
    padding:.34rem 0 .34rem 2.4rem; font-size:.92rem;
  }
  .item button.dot {
    flex:none; width:14px; height:14px; margin-top:.28rem; padding:0;
    border:1.5px solid var(--grey); background:transparent; cursor:pointer; border-radius:0;
  }
  .item button.dot:hover { border-color:var(--red); }
  .item.done  button.dot { background:var(--green); border-color:var(--green); }
  .item.doing button.dot { background:var(--amber); border-color:var(--amber); }
  .item.blocked button.dot { border-color:var(--red); background:var(--red-soft); }
  .item .iid { font-family:var(--f-mono); font-size:.74rem; color:var(--grey); min-width:2.8rem; padding-top:.09rem; }
  .item .itx { color:var(--ink-2); }
  .item.done .itx { color:var(--grey); text-decoration:line-through; text-decoration-thickness:1px; }
  .item.doing .itx { color:var(--ink); font-weight:500; }

  .milestone {
    margin:.5rem 0 .2rem 2.4rem; border-left:2px solid var(--green);
    background:var(--green-soft); padding:.5rem .75rem; font-size:.86rem; color:var(--ink-2);
  }
  .milestone b {
    display:block; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--green); margin-bottom:.15rem; font-weight:500;
  }

  .note { margin:.15rem 0 .5rem 2.4rem; font-size:.84rem; color:var(--grey); }
  .flag {
    display:inline-block; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.09em;
    text-transform:uppercase; padding:.1rem .4rem; border:1px solid currentColor; margin-left:.5rem;
  }
  .flag.gate { color:var(--amber); background:var(--amber-soft); }
  .flag.risk { color:var(--red); background:var(--red-soft); }

  /* ---- off-plan ---- */
  .offplan { margin-top:3rem; }
  .offplan h2 { font-family:var(--f-display); font-weight:700; font-size:1.3rem; margin:0 0 .2rem; }
  .offplan p.l { color:var(--ink-2); font-size:.9rem; margin:0 0 1rem; max-width:62ch; }
  .oprow {
    display:flex; gap:.7rem; align-items:baseline; padding:.5rem 0;
    border-bottom:1px solid var(--rule); font-size:.9rem;
  }
  .oprow .od { font-family:var(--f-mono); font-size:.74rem; color:var(--grey); white-space:nowrap; }
  .oprow .ot { color:var(--ink-2); flex:1; }
  .opempty { color:var(--grey); font-size:.9rem; padding:.6rem 0; border-top:1px solid var(--rule); }
  .opform { display:flex; gap:.5rem; margin-top:.9rem; flex-wrap:wrap; }
  .opform input {
    flex:1; min-width:16rem; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); padding:.45rem .6rem; font:inherit; font-size:.9rem;
  }
  .opform input:focus-visible { outline:2px solid var(--red); outline-offset:1px; }
  button.act {
    font-family:var(--f-mono); font-size:.74rem; letter-spacing:.06em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:none; padding:.5rem .9rem; cursor:pointer;
  }
  button.act:hover { background:var(--red); }
  button.act:disabled { opacity:.4; cursor:default; }

  .saving {
    position:fixed; right:1rem; bottom:1rem; background:var(--ink); color:var(--paper);
    font-family:var(--f-mono); font-size:.72rem; padding:.45rem .8rem; opacity:0;
    transition:opacity .18s; pointer-events:none;
  }
  .saving.on { opacity:1; }
  .ro {
    margin-top:1rem; border:1px solid var(--rule); background:var(--surface-2);
    padding:.6rem .9rem; font-size:.86rem; color:var(--ink-2);
  }

  footer {
    margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
    font-family:var(--f-mono); font-size:.72rem; color:var(--grey);
    display:flex; flex-wrap:wrap; gap:.4rem 1.5rem;
  }
  @media (max-width:620px) {
    .wrap { padding:0 1rem 3rem; }
    .item { padding-left:.5rem; } .milestone, .note { margin-left:.5rem; }
  }
</style>
</head>

    { tier: 4, name: "Threaded throughout", phases: [
      { id: "TH", title: "Shell, distribution, performance",
        note: "Runs alongside the tiers rather than after them.",
        milestone: "Install the app from a signed installer on a clean machine and have it open a project.", items: [
        ["TH.1", "Design system and tokens"],
        ["TH.2", "Document bar and navigation"],
        ["TH.3", "Workspace panels and status"],
        ["TH.4", "Settings"],
        ["TH.5", "Diagnostics"],
        ["TH.6", "Installer and signing"],
        ["TH.7", "Update channel"],
        ["TH.8", "Crash reporting"],
        ["TH.9", "Canvas benchmark inside the Tauri window"],
        ["TH.10", "Perf budget instrumentation"]
      ]}
    ]}
  ];

  var ORDER = ["todo", "doing", "done", "blocked"];

  // --------------------------------------------------------------- state --
  var stateEl = document.getElementById("rb-state");
  var S;
  try { S = JSON.parse(stateEl.textContent); }
  catch (e) { S = { updated: "", offPlan: [], status: {} }; }
  if (!S.status) S.status = {};
  if (!S.offPlan) S.offPlan = [];
  // Rows seeded from source carry {date,text}; rows the page writes carry
  // {d,t}, and the renderer reads d/t — so every seeded row displayed as
  // "undefined undefined". Normalize on load, once, so the next save converges.
  S.offPlan = S.offPlan.map(function (o) {
    return { d: o.d || o.date || "", t: o.t || o.text || "" };
  });

  var artifact = null, writable = true, open = {};

  function allItems() {
    var out = [];
    PLAN.forEach(function (t) { t.phases.forEach(function (p) {
      p.items.forEach(function (it) { out.push({ id: it[0], text: it[1], phase: p }); });
    }); });
    return out;
  }
  function st(id) { return S.status[id] || "todo"; }
  function tally(items) {
    var c = { done: 0, doing: 0, blocked: 0, total: items.length };
    items.forEach(function (i) { var s = st(i[0] || i.id); if (c[s] !== undefined) c[s]++; });
    return c;
  }
  function nextUp() {
    var all = allItems();
    var doing = all.filter(function (i) { return st(i.id) === "doing"; });
    if (doing.length) return { item: doing[0], mode: "doing" };
    var todo = all.filter(function (i) { return st(i.id) === "todo"; });
    if (todo.length) return { item: todo[0], mode: "next" };
    return null;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // -------------------------------------------------------------- render --
  function render() {
    var all = allItems();
    var g = tally(all.map(function (i) { return [i.id]; }));
    var pctDone = g.total ? (g.done / g.total) * 100 : 0;
    var pctDoing = g.total ? (g.doing / g.total) * 100 : 0;
    var nx = nextUp();

    var h = "";
    h += '<div class="top">';
    h +=   '<div class="sub">okular-redbeam → redbeam · build tracker</div>';
    h +=   '<div class="toprow"><h1>The road to parity</h1>';
    h +=     '<div class="headline-count">' + g.done + '<em> / ' + g.total + ' done</em></div></div>';
    h +=   '<div class="meter"><i class="m-done" style="width:' + pctDone.toFixed(2) + '%"></i>' +
             '<i class="m-doing" style="width:' + pctDoing.toFixed(2) + '%"></i></div>';
    h +=   '<div class="legend">' +
             '<span><i class="dotk" style="background:var(--green)"></i><b>' + g.done + '</b> done</span>' +
             '<span><i class="dotk" style="background:var(--amber)"></i><b>' + g.doing + '</b> in progress</span>' +
             '<span><i class="dotk" style="background:var(--red)"></i><b>' + g.blocked + '</b> blocked</span>' +
             '<span><i class="dotk" style="border:1.5px solid var(--grey)"></i><b>' +
                (g.total - g.done - g.doing - g.blocked) + '</b> to do</span>' +
             '<span>off-plan <b>' + S.offPlan.length + '</b></span>' +
           '</div>';
    h += '</div>';

    // NOW
    if (nx) {
      h += '<div class="now' + (nx.mode === "next" ? " idle" : "") + '">';
      h +=   '<div><div class="now-k">' + (nx.mode === "doing" ? "In progress" : "Next up") + '</div>';
      h +=     '<div class="now-t">' + esc(nx.item.text) + '</div>';
      h +=     '<div class="now-m">' + esc(nx.item.phase.title) + '</div></div>';
      h +=   '<div class="now-id">' + esc(nx.item.id) + '</div>';
      h += '</div>';
    } else {
      h += '<div class="now idle"><div><div class="now-k">Complete</div>' +
           '<div class="now-t">Every achievable on the plan is done.</div></div></div>';
    }

    if (!writable) {
      h += '<div class="ro">Read-only view — progress is shown but cannot be changed here.</div>';
    }

    // tiers
    PLAN.forEach(function (t) {
      var titems = [];
      t.phases.forEach(function (p) { p.items.forEach(function (i) { titems.push(i); }); });
      var tc = tally(titems);
      h += '<div class="tierhead"><h2>' + esc(t.name) + '</h2>' +
           '<span class="tcount">' + tc.done + ' / ' + tc.total + '</span></div>';

      t.phases.forEach(function (p) {
        var pc = tally(p.items);
        var isOpen = open[p.id];
        var pd = pc.total ? (pc.done / pc.total) * 100 : 0;
        var pg = pc.total ? (pc.doing / pc.total) * 100 : 0;

        h += '<div class="phase' + (isOpen ? " open" : "") + '">';
        h +=   '<div class="ph" data-phase="' + p.id + '" role="button" tabindex="0">';
        h +=     '<span class="ph-n">' + esc(p.id) + '</span>';
        h +=     '<span class="ph-t">' + esc(p.title) + '</span>';
        if (p.flag) h += '<span class="flag ' + p.flag + '">' + esc(p.flagText) + '</span>';
        h +=     '<span class="ph-bar"><i class="m-done" style="width:' + pd.toFixed(2) + '%;background:var(--green)"></i>' +
                 '<i style="width:' + pg.toFixed(2) + '%;background:var(--amber)"></i></span>';
        h +=     '<span class="ph-c">' + pc.done + '/' + pc.total + '</span>';
        h +=     '<span class="ph-x">' + (isOpen ? "−" : "+") + '</span>';
        h +=   '</div>';

        h +=   '<div class="items">';
        if (p.note) h += '<div class="note">' + esc(p.note) + '</div>';
        p.items.forEach(function (it) {
          var s = st(it[0]);
          h += '<div class="item ' + s + '">';
          h +=   '<button class="dot" data-id="' + it[0] + '" aria-label="' + esc(it[1]) + ': ' + s + '"></button>';
          h +=   '<span class="iid">' + esc(it[0]) + '</span>';
          h +=   '<span class="itx">' + esc(it[1]) + '</span>';
          h += '</div>';
        });
        if (p.milestone) {
          h += '<div class="milestone"><b>Milestone — test it yourself</b>' + esc(p.milestone) + '</div>';
        }
        h +=   '</div>';
        h += '</div>';
      });
    });

    // off plan
    h += '<div class="offplan"><h2>Off-plan work</h2>';
    h += '<p class="l">Anything worked on that is not an achievable above gets logged here. ' +
         'The count sits in the header so detours are visible rather than absorbed.</p>';
    if (S.offPlan.length) {
      S.offPlan.forEach(function (o, i) {
        h += '<div class="oprow"><span class="od">' + esc(o.d) + '</span><span class="ot">' + esc(o.t) + '</span>' +
             (writable ? '<button class="act" data-rm="' + i + '">remove</button>' : '') + '</div>';

      h += '<div class="opempty">Nothing off-plan. Keep it that way.</div>';

      h += '<div class="opform"><input id="opin" placeholder="What was worked on that is not in the plan?" ' +

    h += '<footer><span>updated ' + esc(S.updated || "—") + '</span>' +

         '<span>click a phase to expand · click a marker to cycle status</span></footer>';

  // --------------------------------------------------------------- bind --
  function bind() {
    var root = document.getElementById("root");

    root.querySelectorAll(".ph").forEach(function (el) {
      function toggle() { var id = el.dataset.phase; open[id] = !open[id]; render(); }
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });

    if (!writable) return;

    root.querySelectorAll("button.dot").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = b.dataset.id;
        var cur = st(id);
        var nextS = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length];
        if (nextS === "todo") delete S.status[id]; else S.status[id] = nextS;
        stamp(); render(); save();
      });
    });

    var add = root.querySelector("#opadd");
    if (add) {
      var input = root.querySelector("#opin");
      function commit() {
        var v = (input.value || "").trim();
        if (!v) return;
        S.offPlan.unshift({ d: today(), t: v });
        input.value = "";
        stamp(); render(); save();
      }
      add.addEventListener("click", commit);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") commit(); });
    }

    root.querySelectorAll("button[data-rm]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.offPlan.splice(Number(b.dataset.rm), 1);
        stamp(); render(); save();
      });
    });
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }
  function stamp() { S.updated = today(); }

  // -------------------------------------------------------------- persist --
  // Rebuild the whole document from our own authored style + script and the
  // current state. Never serialize the live DOM: it carries viewer-session
  // state and injected runtime scripts.
  function buildDoc() {
    var css = document.getElementById("rb-style").textContent;
    var js = document.getElementById("rb-app").textContent;
    var close = "<\/script>";
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n" +
      "<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n" +
      "<title>REDBEAM Build Tracker</title>\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
      "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n" +
      "<style id=\"rb-style\">" + css + "</style>\n</head>\n<body>\n" +
      "<div class=\"wrap\"><div id=\"root\"></div></div>\n" +
      "<div class=\"saving\" id=\"saving\">saving…</div>\n" +
      "<script id=\"rb-state\" type=\"application/json\">\n" + JSON.stringify(S, null, 2) + "\n" + close + "\n" +
      "<script id=\"rb-app\">" + js + close + "\n</body>\n</html>";
  }

  var pending = null, timer = null;
  function save() {
    if (!artifact) return;              // capability not resolved (yet or ever)
    pending = true;
    flash(true);
    clearTimeout(timer);
    timer = setTimeout(doSave, 700);    // batch rapid ticks into one publish
  }
  function doSave() {
    if (!artifact || !pending) return;
    pending = false;
    artifact.publish(buildDoc()).then(function () {
      // the view reloads to the new version
    }).catch(function (err) {
      flash(false);
      var code = err && err.code;
      if (code === "conflict") return;  // routine: every view reloads to the winner
      if (code === "not_writer" || code === "not_granted" ||
          code === "not_declared" || code === "capability_disabled") {
        writable = false; render(); return;
      }
      if (code === "rate_limited") { setTimeout(doSave, 4000); pending = true; return; }
      console.warn("[tracker] publish failed:", code, err && err.message);
    });
  }
  function flash(on) {
    var el = document.getElementById("saving");
    if (el) el.classList.toggle("on", !!on);
  }

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      artifact = ns;
      if (!ns) { writable = false; render(); }
    }).catch(function () { writable = false; render(); });
  } else {
    writable = false;
    render();
  }
})();
</script>
</body>
</html>
